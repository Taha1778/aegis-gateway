name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aegis-ci .
      - name: Verify non-root runtime and health
        run: |
          docker run -d --name aegis-ci -p 127.0.0.1:4310:4310 -e GATEWAY_API_KEY=ci-only-application-key-000000 -e ADMIN_API_KEY=ci-only-administrator-key-00000 aegis-ci
          test "$(docker exec aegis-ci id -u)" != "0"
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4310/health; then exit 0; fi
            sleep 2
          done
          docker logs aegis-ci
          exit 1
      - name: Container logs
        if: failure()
        run: docker logs aegis-ci || true
  verify:
    name: Typecheck, Test, Evaluate & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run verification checks (typecheck, tests, and policy evaluation)
        run: npm run check

      - name: Verify formatting
        run: npm run format:check

      - name: Build TypeScript distribution
        run: npm run build

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
